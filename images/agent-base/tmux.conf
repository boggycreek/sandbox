# Agent Sandbox — Unprivileged tmux configuration
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Unbind default prefix and set to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of life
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Non-root unprivileged status styling
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] 🤖 #{host} #[bg=#1e1e2e] "
set -g status-right "#[fg=#a6adc8]Session: #S | %H:%M "
set -g window-status-current-format "#[bg=#b4befe,fg=#11111b,bold] #I:#W#F "
set -g window-status-format "#[fg=#6c7086] #I:#W#F "

# Mouse mode for smooth scrolling
set -g mouse on
