# Do not read /etc/resolv.conf or poll it
no-resolv
no-poll

# Bind to 127.0.0.1 and container interface
listen-address=127.0.0.1
bind-interfaces

# Upstream DNS server mappings for allowlisted domains
server=/github.com/1.1.1.1
server=/github.com/8.8.8.8
server=/api.github.com/1.1.1.1
server=/api.github.com/8.8.8.8
server=/raw.githubusercontent.com/1.1.1.1
server=/raw.githubusercontent.com/8.8.8.8

server=/anthropic.com/1.1.1.1
server=/anthropic.com/8.8.8.8
server=/api.anthropic.com/1.1.1.1
server=/api.anthropic.com/8.8.8.8

server=/npmjs.org/1.1.1.1
server=/npmjs.org/8.8.8.8
server=/registry.npmjs.org/1.1.1.1
server=/registry.npmjs.org/8.8.8.8

server=/debian.org/1.1.1.1
server=/debian.org/8.8.8.8
server=/deb.debian.org/1.1.1.1
server=/deb.debian.org/8.8.8.8

server=/jetbrains.com/1.1.1.1
server=/jetbrains.com/8.8.8.8
server=/download.jetbrains.com/1.1.1.1
server=/download.jetbrains.com/8.8.8.8

# Internal infrastructure upstream DNS resolution (default Podman bridge gateway 10.89.0.1)
server=/valkey/10.89.0.1
server=/fleet-valkey/10.89.0.1
server=/forgejo/10.89.0.1
server=/fleet-forgejo/10.89.0.1
server=/sonarqube/10.89.0.1
server=/fleet-sonarqube/10.89.0.1
server=/agent-sandbox-sonarqube/10.89.0.1
server=/postgres/10.89.0.1
server=/fleet-postgres/10.89.0.1
server=/llm-gateway/10.89.0.1
server=/host.containers.internal/10.89.0.1
server=/dns.podman/10.89.0.1

# Catch-all query drop
server=/#/

# Allowlisted domains dynamically populated into allowed-egress ipset
ipset=/github.com/api.github.com/raw.githubusercontent.com/allowed-egress
ipset=/anthropic.com/api.anthropic.com/allowed-egress
ipset=/npmjs.org/registry.npmjs.org/allowed-egress
ipset=/debian.org/deb.debian.org/allowed-egress
ipset=/jetbrains.com/download.jetbrains.com/allowed-egress
