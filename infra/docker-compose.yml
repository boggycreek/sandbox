version: '3.8'

services:
  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: fleet-valkey
    restart: unless-stopped
    command: ["valkey-server", "--aclfile", "/etc/valkey/valkey-users.acl", "--appendonly", "yes", "--port", "6379"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
      - valkey-config:/etc/valkey
    networks:
      - fleet-infra

  forgejo:
    image: codeberg.org/forgejo/forgejo:9-rootless
    container_name: fleet-forgejo
    restart: unless-stopped
    environment:
      - FORGEJO__server__DOMAIN=forgejo
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__ROOT_URL=http://forgejo:3000/
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__SSH_LISTEN_PORT=2222
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__PATH=/var/lib/gitea/data/gitea.db
      - FORGEJO__service__DISABLE_REGISTRATION=false
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=false
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2223:2222"
    volumes:
      - forgejo-data:/var/lib/gitea
    networks:
      fleet-infra:
        aliases:
          - forgejo
          - gitea

  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleet-infra

  sonarqube:
    image: fleet-sonarqube:latest
    container_name: fleet-sonarqube
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - fleet-infra

networks:
  fleet-infra:
    name: fleet-infra

volumes:
  valkey-data:
    name: fleet-valkey-data
  valkey-config:
    name: fleet-valkey-config
  forgejo-data:
    name: fleet-forgejo-data
  postgres-data:
    name: fleet-postgres-data
  sonarqube-data:
    name: fleet-sonarqube-data
  sonarqube-extensions:
    name: fleet-sonarqube-extensions
  sonarqube-logs:
    name: fleet-sonarqube-logs
